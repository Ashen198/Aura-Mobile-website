<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="CSS/loginStyle.css">
    <title>Login Aura</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="Login-box">
        <h1>AURA MOBILE</h1>
        <h2>Login</h2>

        <!-- We use an onsubmit rule here to stop the browser page redirect completely -->
        <form onsubmit="event.preventDefault(); login();">
            
            <div class="input-box">
                <input type="text" id="username" placeholder="Username / Email" required>
            </div>

            <div class="input-box">
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <!-- Changed to type="submit" so it properly obeys the form's preventDefault rule -->
            <button type="submit">Submit</button>

        </form>

        <p class="register">
            Don't have an account? <a href="register.html">Register</a>
        </p>
    </div>
    
    <!-- CRUCIAL FIX: This links your JavaScript file to your webpage -->
    <script src="JS/login.js"></script>
    
</body>
</html>
